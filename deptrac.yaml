deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*

        - name: BundleRoot
          collectors:
              - type: classLike
                value: '^Msstc4Symfony\\TracingBridgeLogic\\TracingBridgeLogicBundle$'

    ruleset:
        # The logic middleware running every Action in its own trace span depends on nothing else in the bridge.
        Infrastructure: ~

        BundleRoot: ~
